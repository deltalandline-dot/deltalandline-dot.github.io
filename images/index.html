<!doctype html><html lang="en"><head><meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Images — Delta</title><link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet"><style>
:root{--ink:#111110;--paper:#f5f4ef;--red:#ff3028}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Switzer,Arial,sans-serif}button,input{font:inherit}a,button{color:inherit}a{text-decoration:none}a:hover,button:hover{color:var(--red)}button{background:none;border:0;cursor:pointer}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}:focus-visible{outline:2px solid var(--red);outline-offset:5px}header{position:fixed;z-index:3;top:0;left:0;width:100%;height:80px;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em;pointer-events:none}header>*{pointer-events:auto}header a,header button{min-height:40px;display:flex;align-items:center;padding:0 10px;background:var(--paper)}.menu{position:absolute;right:28px;top:67px;background:var(--paper);border:1px solid #11111022;padding:12px}.menu a{padding:10px;letter-spacing:0}.gallery{height:100svh;display:flex;align-items:center;justify-content:center;padding:32px;overflow:hidden}.photo-frame{margin:0;line-height:0;flex-shrink:0}.photo-frame img{width:100%;height:100%;object-fit:cover;display:block}.empty{text-align:center;max-width:320px;line-height:1.7;font-size:14px;color:#666}.upload{max-width:720px;margin:110px auto 40px;padding:0 28px}.upload h1{font-weight:500;font-size:32px;letter-spacing:-.03em}.note{font-size:13px;line-height:1.7;color:#666}.file-label{display:inline-block;cursor:pointer;border:1px solid var(--ink);padding:13px 20px;font-size:13px;margin:15px 0}.file-label:hover{color:var(--red);border-color:var(--red)}#file{position:absolute;width:1px;height:1px;clip-path:inset(50%)}.file-label:focus-within{outline:2px solid var(--red);outline-offset:4px}.crop-preview{display:block;max-height:48vh;max-width:100%;object-fit:cover;margin:24px auto}.upload input[type=text]{width:100%;border:0;border-bottom:1px solid #11111055;background:none;padding:12px 0}.save{display:block;background:var(--ink);color:var(--paper);padding:13px 20px;margin-top:20px}.save:hover{background:var(--red);color:var(--paper)}.status{font-size:13px;line-height:1.6;min-height:24px;margin-top:20px}@media(max-width:600px){.gallery{padding:24px}header{padding:16px}.menu{right:16px}}
</style></head><body><header><a href="../" aria-label="Back to portfolio">← HOME</a><button id="menu-button" aria-label="Image studio menu" aria-expanded="false" aria-controls="menu">···</button><nav id="menu" class="menu" hidden><a href="#gallery">Gallery</a><a href="#upload">Upload</a></nav></header>
<main><section id="gallery" class="gallery" aria-label="Photo gallery"><figure id="frame" class="photo-frame" hidden><img id="photo" alt=""></figure><p id="empty" class="empty">No photographs yet.</p></section><section id="upload" class="upload" hidden><h1>Upload</h1><p class="note">Choose a photo, check the crop, and add it to the rotation. Landscape stays landscape; portrait stays portrait.</p><p id="storage-note" class="note"></p><div id="login" hidden><form id="login-form"><input id="email" type="email" placeholder="Email address" aria-label="Email address" autocomplete="email" required><button id="send-code" class="save">Email sign-in link</button></form><p id="login-status" role="status"></p></div><button id="sign-out" hidden>Sign out</button><div id="upload-controls"><label class="file-label">Choose a photo<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="note">JPEG, PNG or WebP · up to 20 MB</p><img id="preview" class="crop-preview" alt="Centered crop preview" hidden><form id="upload-form" hidden><input id="description" type="text" maxlength="300" placeholder="Description (optional)" aria-label="Photo description"><button id="save" class="save" type="submit">Save to gallery on this Mac</button></form></div><a id="success" href="#gallery" hidden>View gallery ↗</a><p id="status" class="status" role="status"></p></section></main><script type="module" src="app.js?v=5f3815fe6039"></script></body></html>
