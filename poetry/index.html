<header><a href="../" aria-label="Back to portfolio">← HOME</a><span class="section-name" id="section-name">READ</span><button id="studio-toggle" aria-label="Open studio menu" aria-expanded="false" aria-controls="studio-menu">···</button><nav class="studio-menu" id="studio-menu" aria-label="Studio" hidden><a href="#read">Read</a><a href="#write">Write</a><a href="#review">Review</a><button id="studio-sign-out" hidden>Sign out</button></nav></header>
<main><section id="studio-auth" class="workspace" hidden><p>Sign in to open your private studio.</p><form id="studio-login-form"><input id="studio-email" type="email" autocomplete="email" placeholder="Email" required aria-label="Email"><button id="studio-send">Send sign-in link</button></form><p id="studio-login-state" role="status"></p></section>
<section id="read-view" aria-label="Read poetry"><div class="pages" id="pages" hidden tabindex="0" aria-label="Poems. Swipe sideways or use left and right arrows."></div><div class="empty" id="empty" hidden><h1>A place for poems.</h1><p id="empty-message">No poems have been published here yet.</p></div><footer class="reader-footer" id="reader-footer" hidden><button id="previous" aria-label="Previous poem">←</button><span id="position" aria-live="polite"></span><button id="next" aria-label="Next poem">→</button></footer></section>
<section id="write-view" class="workspace" hidden><h1>Write</h1><p class="note" id="studio-note"></p><div class="editor-layout"><aside><button id="new-draft">+ New poem</button><div id="draft-list" class="draft-list"></div></aside><div class="editor"><input id="draft-title" aria-label="Poem title" placeholder="Untitled"><textarea id="draft-body" aria-label="Poem text" placeholder="Begin here…" spellcheck="true"></textarea><div class="editor-tools"><button id="keep-draft">Keep a version</button><button id="export-draft">Export .txt</button><button id="show-history" aria-expanded="false">Versions</button><span id="save-state" class="save-state" role="status"></span></div><div class="history" id="history" hidden></div></div></div></section>

</main><script type="module" src="app.js?v=5ce1c26a06f5"></script></body></html>
